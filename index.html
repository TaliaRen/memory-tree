<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --acc: 255,215,120;
    --acc-hi: 255,200,60;
    --text: #f5e6c8;
    --sans: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  :root[data-season="spring"] { --acc: 255,178,206; --acc-hi: 255,138,184; }
  :root[data-season="summer"] { --acc: 172,232,150; --acc-hi: 128,220,104; }
  :root[data-season="autumn"] { --acc: 255,168,98;  --acc-hi: 255,118,52;  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; overflow: hidden; font-family: var(--sans); }

  body.pre #gesture-panel, body.pre #music-btn, body.pre #cam-preview { display: none; }

  #camera-feed { display: none; }

  #cam-preview {
    position: fixed;
    bottom: 16px; right: 16px;
    width: 140px; height: 105px;
    border: 1px solid rgba(var(--acc),0.25);
    border-radius: 8px;
    overflow: hidden;
    opacity: 0.65;
    z-index: 50;
  }
  #cam-preview video {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  .glass {
    background: rgba(10,10,14,0.55);
    border: 1px solid rgba(var(--acc),0.25);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 24px rgba(0,0,0,0.3);
    transition: border-color .4s, background .2s, color .4s;
  }

  #gesture-panel {
    position: fixed;
    top: 18px; left: 18px;
    z-index: 100;
    min-width: 230px;
    border-radius: 12px;
    padding: 14px 18px;
    color: var(--text);
  }
  #gesture-panel .gp-current {
    font-size: 13px; font-weight: 600; letter-spacing: .5px;
    margin-bottom: 10px;
    color: rgba(var(--acc),1);
  }
  #gesture-panel .gp-current span { color: rgb(var(--acc-hi)); }
  #gesture-panel .gp-legend {
    font-size: 11.5px;
    line-height: 1.9;
    color: rgba(245,230,200,0.75);
    border-top: 1px solid rgba(var(--acc),0.15);
    padding-top: 8px;
  }

  #top-actions {
    position: fixed;
    top: 18px; right: 18px;
    z-index: 110;
    display: flex; gap: 8px;
  }
  body.pre #top-actions { display: none; }
  .top-btn {
    height: 40px;
    border-radius: 12px;
    padding: 0 15px 0 13px;
    color: rgb(var(--acc));
    font: 600 13px var(--sans);
    letter-spacing: .2px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    user-select: none;
  }
  .top-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
  .top-btn:hover, .top-btn.active { background: rgba(20,20,28,0.78); border-color: rgba(var(--acc),0.55); }
  .top-btn.active { box-shadow: 0 0 0 3px rgba(var(--acc),0.12), 0 0 24px rgba(0,0,0,0.3); }
  #music-btn .ic-off { display: none; }
  #music-btn.muted { color: rgba(245,230,200,0.45); border-color: rgba(var(--acc),0.12); }
  #music-btn.muted .ic-on { display: none; }
  #music-btn.muted .ic-off { display: block; }

  /* Share panel */
  #share-panel {
    position: fixed;
    top: 68px; right: 18px;
    z-index: 120;
    width: 320px;
    max-width: calc(100vw - 32px);
    padding: 18px 18px 16px;
    background: rgba(14,11,15,0.94);
    border: 1px solid rgba(var(--acc),0.25);
    border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.05);
    color: var(--text);
    font-family: var(--sans);
    transform-origin: top right;
    animation: panel-in .22s cubic-bezier(.2,.9,.3,1.2);
  }
  #share-panel[hidden] { display: none; }
  @keyframes panel-in { from { opacity: 0; transform: translateY(-6px) scale(.96); } to { opacity: 1; transform: none; } }
  .sp-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
  .sp-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-weight: 600;
    font-size: 24px; line-height: 1.1;
    color: #fff4e2;
  }
  .sp-close {
    width: 28px; height: 28px; flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: rgba(245,230,200,0.6);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .sp-close:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .sp-stack { display: flex; align-items: center; margin-bottom: 16px; padding-left: 6px; }
  .sp-stack img, .sp-stack .more {
    width: 44px; height: 44px;
    border-radius: 11px;
    object-fit: cover;
    margin-left: -8px;
    border: 2px solid rgb(14,11,15);
    box-shadow: 0 0 0 1px rgba(var(--acc),0.35);
    background: rgba(var(--acc),0.12);
  }
  .sp-stack img:nth-child(odd) { transform: rotate(-4deg); }
  .sp-stack img:nth-child(even) { transform: rotate(3deg) translateY(2px); }
  .sp-stack .more {
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600;
    color: rgb(var(--acc));
  }
  .sp-link {
    display: flex; align-items: center; gap: 8px;
    height: 40px;
    padding: 0 12px;
    border-radius: 11px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 12.5px;
    color: rgba(245,230,200,0.7);
    margin-bottom: 10px;
  }
  .sp-link svg { color: rgb(var(--acc)); flex-shrink: 0; }
  .sp-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-btn {
    width: 100%; height: 44px;
    border-radius: 12px;
    font: 600 14px var(--sans);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
    transition: transform .15s, box-shadow .2s, background .2s;
  }
  .sp-btn svg { width: 16px; height: 16px; }
  #sp-copy {
    border: 0;
    background: linear-gradient(135deg, rgb(var(--acc-hi)), rgb(var(--acc)));
    color: #1b130a;
    box-shadow: 0 8px 24px rgba(var(--acc),0.25);
  }
  #sp-copy:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(var(--acc),0.38); }
  #sp-copy .ic-done { display: none; }
  #sp-copy.done .ic-copy { display: none; }
  #sp-copy.done .ic-done { display: block; animation: pop .3s ease-out; }

  /* Season switcher */
  #season-bar {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 1200;
    display: flex; gap: 2px;
    padding: 5px;
    border-radius: 999px;
  }
  .season-opt {
    border: 0; background: transparent;
    color: rgba(245,230,200,0.55);
    font: 500 12.5px/1 var(--sans);
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: color .3s, background .3s, box-shadow .3s;
  }
  .season-opt:hover { color: var(--text); }
  .season-opt.active {
    background: rgba(var(--acc),0.16);
    color: rgb(var(--acc));
    box-shadow: inset 0 0 0 1px rgba(var(--acc),0.45);
  }
  .season-opt .si { font-size: 14px; }

  /* Upload screen */
  #upload-screen {
    position: fixed; inset: 0; z-index: 1100;
    display: flex; align-items: center;
    padding: 24px clamp(16px, 5vw, 72px);
    background: linear-gradient(90deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.3) 42%, rgba(0,0,0,0) 65%);
    transition: opacity .6s;
  }
  #upload-screen.out { opacity: 0; pointer-events: none; }
  .upload-card {
    width: 100%; max-width: 440px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;
    background: rgba(14,11,15,0.82);
    border: 1px solid rgba(var(--acc),0.22);
    border-radius: 22px;
    padding: 30px 28px 26px;
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    color: var(--text);
    transition: border-color .3s, box-shadow .3s;
  }
  #upload-screen.drag .upload-card {
    border-color: rgba(var(--acc),.85);
    box-shadow: 0 0 0 4px rgba(var(--acc),.15), 0 30px 80px rgba(0,0,0,.45);
  }
  .eyebrow {
    font-size: 11px; font-weight: 600;
    letter-spacing: .22em; text-transform: uppercase;
    color: rgb(var(--acc));
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
    transition: color .4s;
  }
  .eyebrow::before { content: ''; width: 18px; height: 1px; background: currentColor; opacity: .7; }
  .upload-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: 40px; line-height: 1.02;
    color: #fff4e2;
    margin-bottom: 22px;
  }
  #photo-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .slot {
    aspect-ratio: 1;
    border-radius: 12px;
    border: 1px dashed rgba(var(--acc),.16);
    background: rgba(255,255,255,.015);
    position: relative;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .slot:hover { border-color: rgba(var(--acc),.4); }
  .slot.add {
    border-style: solid;
    border-color: rgba(var(--acc),.45);
    background: rgba(var(--acc),.08);
    display: grid; place-items: center;
    color: rgb(var(--acc));
  }
  .slot.add:hover { background: rgba(var(--acc),.16); }
  .slot.filled { border: 0; cursor: default; }
  .slot.loading {
    border: 0; cursor: default;
    background: linear-gradient(100deg, rgba(var(--acc),.06) 30%, rgba(var(--acc),.18) 50%, rgba(var(--acc),.06) 70%);
    background-size: 220% 100%;
    animation: shimmer 1.1s linear infinite;
  }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .slot.filled img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    box-shadow: 0 0 0 1px rgba(var(--acc),.35), 0 0 14px rgba(var(--acc),.18);
  }
  .slot.filled img.new { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .slot .del {
    position: absolute; top: 4px; right: 4px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(10,8,10,.78);
    border: 1px solid rgba(255,255,255,.2);
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s, background .15s;
  }
  .slot.filled:hover .del, .slot .del:focus-visible { opacity: 1; }
  .slot .del:hover { background: rgba(190,50,50,.9); }
  @media (hover: none) { .slot .del { opacity: 1; } }
  .grid-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px;
    color: rgba(245,230,200,.5);
    margin-bottom: 18px;
    min-height: 16px;
  }
  .grid-meta .warn { color: #ffab7a; }
  #start-btn {
    width: 100%; height: 48px;
    border: 0; border-radius: 14px;
    background: linear-gradient(135deg, rgb(var(--acc-hi)), rgb(var(--acc)));
    color: #1b130a;
    font: 600 15px var(--sans);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(var(--acc),.28);
    transition: transform .15s, box-shadow .2s, opacity .2s;
  }
  #start-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 12px 34px rgba(var(--acc),.42); }
  #start-btn:disabled { opacity: .3; cursor: default; box-shadow: none; }

  @media (max-width: 760px) {
    #upload-screen { justify-content: center; background: rgba(0,0,0,.45); padding-bottom: 80px; }
    .upload-card { padding: 24px 20px 18px; }
    .upload-title { font-size: 32px; }
    #season-bar { left: 16px; transform: none; }
    .season-opt .sl { display: none; }
    .season-opt { padding: 9px 11px; }
  }
</style>
</head>
<body class="pre">

<div id="upload-screen">
  <div class="upload-card">
    <div class="eyebrow" id="season-eyebrow">Memory Tree</div>
    <h1 class="upload-title">Hang your memories<br>on the tree</h1>
    <input type="file" id="file-input" accept="image/*,.heic,.heif" multiple hidden>
    <div id="photo-grid"></div>
    <div class="grid-meta"><span id="photo-count">0 / 15</span><span>JPG / PNG</span></div>
    <button id="start-btn" disabled>
      Grow my tree
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<video id="camera-feed" autoplay playsinline muted></video>

<div id="cam-preview">
  <video id="cam-mirror" autoplay playsinline muted></video>
</div>

<audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

<div id="top-actions">
  <button id="share-btn" class="top-btn glass" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="3.5" r="2"/><circle cx="4" cy="8" r="2"/><circle cx="12" cy="12.5" r="2"/><path d="M5.8 7l4.4-2.5M5.8 9l4.4 2.5"/></svg>
    <span>Share</span>
  </button>
  <button id="music-btn" class="top-btn glass" title="Toggle music">
    <svg class="ic-on" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12V3.5l7-1.5v8.5"/><circle cx="4.3" cy="12" r="1.8"/><circle cx="11.3" cy="10.5" r="1.8"/></svg>
    <svg class="ic-off" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12V3.5l7-1.5v8.5"/><circle cx="4.3" cy="12" r="1.8"/><circle cx="11.3" cy="10.5" r="1.8"/><path d="M2 2l12 12"/></svg>
    <span class="lbl">Music</span>
  </button>
</div>

<div id="share-panel" role="dialog" aria-label="Share your tree" hidden>
  <div class="sp-head">
    <div>
      <div class="sp-title">Share your tree</div>
    </div>
    <button class="sp-close" id="sp-close" aria-label="Close">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sp-stack" id="sp-stack"></div>
  <div class="sp-link">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6.5 9.5l3-3M7 4.5l1.2-1.2a2.8 2.8 0 014 4L11 8.5M9 11.5l-1.2 1.2a2.8 2.8 0 01-4-4L5 7.5"/></svg>
    <span id="sp-url"></span>
  </div>
  <button id="sp-copy" class="sp-btn">
    <svg class="ic-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 5.5V4a1.5 1.5 0 00-1.5-1.5H4A1.5 1.5 0 002.5 4v5A1.5 1.5 0 004 10.5h1.5"/></svg>
    <svg class="ic-done" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>
    <span class="lbl">Copy link</span>
  </button>
</div>

<div id="season-bar" class="glass"></div>

<div id="gesture-panel" class="glass">
  <div class="gp-current">Gesture: <span id="gesture-value">FIST</span></div>
  <div class="gp-legend">
    ✊ Fist → Assemble tree &amp; rotate<br>
    🖐 Open Palm → Scatter<br>
    👋 Wave → Spin scene<br>
    🤏 Pinch → Focus photo
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';


// ─── Config ────────────────────────────────────────────────────
const N       = 3000; // particle count
const TREE_H  = 4.2;
const TREE_R  = 1.8;
const SCAT_R  = 9;
const WAVE_DAMP = 0.96;
const WAVE_THR  = 0.22;
const DEBOUNCE  = 6;
const HAND_HIST = 20;

const DIM = 1.5; // overall particle brightness multiplier
const PHOTO_TREE_SCALE       = 0.18;
const PHOTO_SCATTER_SCALE    = 1.1;
const PHOTO_FOCUS_SCALE      = 2.8;
const MORPH_SECONDS          = 1.9;

// ─── Seasons ─────────────────────────────────────────────────────
// palette entries: [[r,g,b], weight]
const SEASONS = {
  spring: { label:'Spring', icon:'🌸', shape:'canopy', bg:0x070309, ambient:0xffd6e6,
    palette:[[[1,.4,.66],.4],[[1,.7,.84],.28],[[.9,.25,.55],.24],[[.45,.85,.35],.08]],
    ground:.04, ornament:'blossom', ornCount:46, fall:'petal', star:false },
  summer: { label:'Summer', icon:'🌿', shape:'canopy', bg:0x010604, ambient:0xd9ffb8,
    palette:[[[.22,.82,.32],.45],[[.5,.92,.3],.3],[[.1,.55,.28],.25]],
    ground:0, ornament:'leaf', ornCount:40, fall:'firefly', star:false },
  autumn: { label:'Autumn', icon:'🍁', shape:'canopy', bg:0x080302, ambient:0xffcf99,
    palette:[[[1,.2,.04],.36],[[.85,.05,.03],.28],[[1,.42,.06],.26],[[.95,.68,.12],.10]],
    ground:.07, ornament:'maple', ornCount:48, fall:'leaf', star:false },
  winter: { label:'Winter', icon:'❄️', shape:'cone', bg:0x000106, ambient:0xffefc0,
    palette:[[[1,.88,.18],.6],[[.18,.85,.3],.2],[[1,.18,.18],.2]],
    ground:0, ornament:'ball', ornCount:55, fall:'snow', star:true },
};
const SEASON_ORDER = ['spring','summer','autumn','winter'];
const SEASON_MONTHS = { spring:'March – May', summer:'June – August', autumn:'September – November', winter:'December – February' };
const TRUNK_COL = [.5,.26,.12];

function seasonFromDate(d = new Date()) {
  const m = d.getMonth();
  if (m>=2 && m<=4) return 'spring';
  if (m>=5 && m<=7) return 'summer';
  if (m>=8 && m<=10) return 'autumn';
  return 'winter';
}

function rnd(a,b) { return a + Math.random()*(b-a); }
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }
function pickPalette(pal) {
  let r = Math.random();
  for (const [c,w] of pal) { if ((r -= w) <= 0) return c; }
  return pal[pal.length-1][0];
}

// ─── Renderer / Scene / Camera ────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 0.7;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000106);

const cam = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
cam.position.set(0, 1.2, 9);
cam.lookAt(0, 0.8, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.38,  // strength
  0.4,   // radius
  0.35   // threshold
);
composer.addPass(bloom);

const TREE_DROP = 1.1; // lowers the tree so it sits in the middle of the screen
const grp = new THREE.Group();
grp.position.y = -TREE_DROP;
scene.add(grp);

// ─── Textures ────────────────────────────────────────────────────
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  if (srgb) tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function glowTex() {
  return canvasTex(64, 64, g => {
    const gr = g.createRadialGradient(32,32,0,32,32,32);
    gr.addColorStop(0,   'rgba(255,255,255,1)');
    gr.addColorStop(.15, 'rgba(255,255,255,.9)');
    gr.addColorStop(.5,  'rgba(255,255,255,.25)');
    gr.addColorStop(1,   'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0,0,64,64);
  }, false);
}

function makeOrnamentTex(hexColor) {
  return canvasTex(64, 64, ctx => {
    const gr = ctx.createRadialGradient(22,20,2,32,32,28);
    gr.addColorStop(0,   'rgba(255,255,255,0.95)');
    gr.addColorStop(0.18, hexColor);
    gr.addColorStop(1,   'rgba(0,0,0,0.55)');
    ctx.beginPath(); ctx.arc(32,32,28,0,Math.PI*2);
    ctx.fillStyle = gr; ctx.fill();
    ctx.fillStyle = 'rgba(200,200,200,0.9)';
    ctx.fillRect(29,3,6,7);
  }, false);
}

function makeSnowflakeTex() {
  return canvasTex(64, 64, ctx => {
    ctx.strokeStyle = 'rgba(220,240,255,0.95)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    for (let i=0;i<6;i++) {
      const a = (i*Math.PI)/3;
      ctx.beginPath(); ctx.moveTo(32,32);
      ctx.lineTo(32+Math.cos(a)*26, 32+Math.sin(a)*26); ctx.stroke();
      for (const j of [0.4,0.7]) {
        const bx=32+Math.cos(a)*26*j, by=32+Math.sin(a)*26*j;
        ctx.beginPath();
        ctx.moveTo(bx+Math.cos(a+Math.PI/2)*8, by+Math.sin(a+Math.PI/2)*8);
        ctx.lineTo(bx-Math.cos(a+Math.PI/2)*8, by-Math.sin(a+Math.PI/2)*8);
        ctx.stroke();
      }
    }
  }, false);
}

function makeMapleTex(color, dark) {
  return canvasTex(64, 64, ctx => {
    const cx = 32, cy = 30, R = 25;
    ctx.beginPath();
    for (let k=0;k<=240;k++) {
      const th = k/240*Math.PI*2;               // 0 = up, clockwise
      let r = 0.5 + 0.5*Math.pow(Math.abs(Math.cos(2.5*th)), 0.7);
      r *= 1 + 0.07*Math.sin(th*26);            // serrated edge
      r *= 1 - 0.35*Math.pow(Math.max(0, -Math.cos(th)), 6); // shallow notch at the stem
      const x = cx + Math.sin(th)*R*r, y = cy - Math.cos(th)*R*r;
      k===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    const gr = ctx.createRadialGradient(cx,cy,2,cx,cy,R);
    gr.addColorStop(0, color); gr.addColorStop(1, dark);
    ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = 'rgba(255,230,180,0.45)'; ctx.lineWidth = 1.2;
    for (let k=0;k<5;k++) {
      const th = k*Math.PI*2/5;
      ctx.beginPath(); ctx.moveTo(cx,cy+4);
      ctx.lineTo(cx+Math.sin(th)*R*.85, cy-Math.cos(th)*R*.85); ctx.stroke();
    }
    ctx.strokeStyle = dark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx,cy+4); ctx.lineTo(cx+2,62); ctx.stroke();
  });
}

function makePetalTex(color) {
  return canvasTex(48, 48, ctx => {
    const gr = ctx.createLinearGradient(24,4,24,44);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, color);
    ctx.beginPath(); ctx.ellipse(24,25,12,19,0,0,Math.PI*2);
    ctx.fillStyle = gr; ctx.fill();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath(); ctx.arc(24,4,5,0,Math.PI*2); ctx.fill();
  });
}

function makeBlossomTex(color) {
  return canvasTex(64, 64, ctx => {
    for (let k=0;k<5;k++) {
      const a = k*Math.PI*2/5 - Math.PI/2;
      const px = 32+Math.cos(a)*13, py = 32+Math.sin(a)*13;
      const gr = ctx.createRadialGradient(32,32,2,px,py,14);
      gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, color);
      ctx.beginPath(); ctx.arc(px,py,12.5,0,Math.PI*2);
      ctx.fillStyle = gr; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(32,32,5,0,Math.PI*2);
    ctx.fillStyle = '#ffd36b'; ctx.fill();
  });
}

function makeLeafTex(color, dark) {
  return canvasTex(64, 64, ctx => {
    ctx.translate(32,32); ctx.rotate(-0.5);
    ctx.beginPath();
    ctx.moveTo(0,-27);
    ctx.bezierCurveTo(17,-14, 15,12, 0,25);
    ctx.bezierCurveTo(-15,12, -17,-14, 0,-27);
    const gr = ctx.createLinearGradient(-14,0,14,0);
    gr.addColorStop(0, dark); gr.addColorStop(.5, color); gr.addColorStop(1, dark);
    ctx.fillStyle = gr; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,220,0.4)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0,-22); ctx.lineTo(0,30); ctx.stroke();
  });
}

// ─── Tree shapes ─────────────────────────────────────────────────
// Winter: cone
function conePos(radiusFactorMin, radiusFactorMax) {
  const u = Math.random();
  const y = u*TREE_H - TREE_H*0.05;
  const maxR = TREE_R * Math.pow(1-u, 1.3);
  const r = (radiusFactorMin + Math.random()*(radiusFactorMax-radiusFactorMin)) * maxR;
  const a = Math.random()*Math.PI*2;
  return new THREE.Vector3(r*Math.cos(a), y, r*Math.sin(a));
}
function coneParticlePos() {
  const u = Math.random();
  const y = u*TREE_H - TREE_H*0.05;
  const maxR = TREE_R * Math.pow(1-u, 1.3);
  const r = Math.sqrt(Math.random()) * maxR;
  const a = Math.random()*Math.PI*2;
  if (u < 0.06) return new THREE.Vector3((Math.random()-.5)*.28, y-.12, (Math.random()-.5)*.28);
  return new THREE.Vector3(r*Math.cos(a), y, r*Math.sin(a));
}

// Spring / summer / autumn: trunk + branches + bumpy canopy of leaf particles
const GROUND_Y  = -0.25;
const TRUNK_TOP = 2.3;
const CANOPY_BLOBS = [
  { c:[ 0.0, 2.7, 0.0], r:[1.6,1.1,1.6] },
  { c:[ 1.3, 2.4, 0.3], r:[.95,.85,.95] },
  { c:[-1.3, 2.5,-0.2], r:[.95,.85,.95] },
  { c:[ 0.4, 3.4, 0.6], r:[.9,.8,.9] },
  { c:[-0.5, 3.3,-0.6], r:[.9,.8,.9] },
  { c:[ 0.2, 2.3, 1.2], r:[.85,.75,.85] },
  { c:[-0.2, 2.4,-1.3], r:[.85,.75,.85] },
  { c:[ 0.9, 3.0,-0.9], r:[.8,.75,.8] },
  { c:[-0.9, 2.9, 0.9], r:[.8,.75,.8] },
];
const BLOB_W = CANOPY_BLOBS.map(b => b.r[0]*b.r[1]*b.r[2]);
const BLOB_WSUM = BLOB_W.reduce((a,b)=>a+b, 0);
function pickBlob() {
  let r = Math.random()*BLOB_WSUM;
  for (let i=0;i<CANOPY_BLOBS.length;i++) { if ((r -= BLOB_W[i]) <= 0) return CANOPY_BLOBS[i]; }
  return CANOPY_BLOBS[0];
}
const BRANCHES = CANOPY_BLOBS.slice(1).map((b, i) => ({
  start: new THREE.Vector3(0, 1.25 + (i%4)*0.25, 0),
  end:   new THREE.Vector3(b.c[0]*0.85, b.c[1]-0.15, b.c[2]*0.85),
}));

function canopyPos(kMin = 0, kMax = 1, bias = 0.45) {
  const b = pickBlob();
  const u = Math.random()*2-1, a = Math.random()*Math.PI*2, s = Math.sqrt(1-u*u);
  const k = kMin + (kMax-kMin)*Math.pow(Math.random(), bias);
  return new THREE.Vector3(
    b.c[0] + b.r[0]*s*Math.cos(a)*k,
    b.c[1] + b.r[1]*u*k,
    b.c[2] + b.r[2]*s*Math.sin(a)*k,
  );
}
function trunkPos() {
  const v = Math.random();
  const y = GROUND_Y + v*(TRUNK_TOP-GROUND_Y);
  const r = (0.2 - 0.08*v + 0.2*Math.max(0, 1-v/0.12)) * (0.7 + 0.3*Math.sqrt(Math.random()));
  const a = Math.random()*Math.PI*2;
  return new THREE.Vector3(r*Math.cos(a) + Math.sin(v*2.2)*0.08, y, r*Math.sin(a));
}
function branchPos() {
  const b = pick(BRANCHES);
  const t = Math.random();
  const p = b.start.clone().lerp(b.end, t);
  p.y += Math.sin(t*Math.PI)*0.22;
  const r = (0.07*(1-t) + 0.02) * Math.sqrt(Math.random());
  const a = Math.random()*Math.PI*2, u = Math.random()*2-1, s = Math.sqrt(1-u*u);
  return p.add(new THREE.Vector3(r*s*Math.cos(a), r*u, r*s*Math.sin(a)));
}
function groundPos() {
  const r = 0.3 + Math.sqrt(Math.random())*1.9;
  const a = Math.random()*Math.PI*2;
  return new THREE.Vector3(r*Math.cos(a), GROUND_Y + Math.random()*0.06, r*Math.sin(a));
}

function buildSeasonTree(name, outPos, outCol) {
  const s = SEASONS[name];
  for (let i=0;i<N;i++) {
    let p, c, b = (.35 + Math.random()*.3) * DIM;
    if (s.shape === 'cone') {
      p = coneParticlePos(); c = pickPalette(s.palette);
    } else {
      const r = Math.random();
      if (r < 0.12)                 { p = trunkPos();  c = TRUNK_COL; b *= 0.75; }
      else if (r < 0.19)            { p = branchPos(); c = TRUNK_COL; b *= 0.75; }
      else if (r < 0.19 + s.ground) { p = groundPos(); c = pickPalette(s.palette); b *= 0.8; }
      else                          { p = canopyPos(); c = pickPalette(s.palette); }
    }
    outPos[i*3]=p.x; outPos[i*3+1]=p.y; outPos[i*3+2]=p.z;
    outCol[i*3]=c[0]*b; outCol[i*3+1]=c[1]*b; outCol[i*3+2]=c[2]*b;
  }
}

function scatterPos() {
  const phi = Math.acos(2*Math.random()-1);
  const a = Math.random()*Math.PI*2;
  const r = 3.5 + Math.random()*SCAT_R;
  return new THREE.Vector3(r*Math.sin(phi)*Math.cos(a), r*Math.sin(phi)*Math.sin(a)*.55 + TREE_DROP, r*Math.cos(phi));
}

  s.closePath(); return s;

// ─── Rounded photo card (glow border + clipped photo) ────────────
function roundedRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
}

function makeRoundedPhotoTex(img) {
  const S = 480, pad = 10, r = 44; // square canvas, center-crop photo
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const ctx = c.getContext('2d');
  ctx.save();
  roundedRect(ctx, pad, pad, S-pad*2, S-pad*2, r);
  ctx.clip();
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  let sx, sy, sw, sh;
  if (iw > ih) { sh = ih; sw = sh; sx = (iw-sw)/2; sy = 0; }
  else         { sw = iw; sh = sw; sx = 0; sy = (ih-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, pad, pad, S-pad*2, S-pad*2);
  ctx.restore();
  ctx.save();
  ctx.shadowColor = 'rgba(255,200,120,0.95)'; ctx.shadowBlur = 20;
  roundedRect(ctx, pad, pad, S-pad*2, S-pad*2, r);
  ctx.strokeStyle = 'rgba(255,230,160,0.95)'; ctx.lineWidth = 5; ctx.stroke();
  ctx.restore();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ─── Photos ──────────────────────────────────────────────────────
const PHOTOS = [];
let TOTAL_PHOTOS = 1; // set dynamically from user upload

// Evenly spread angles, scrambled heights, inside the tree volume
function photoTreePos(idx, total, rSeed, seasonName) {
  const angle = (idx / total) * Math.PI * 2;
  const hFrac = 0.1 + ((idx * 7) % total) / total * 0.75;
  let y, r;
  if (SEASONS[seasonName].shape === 'cone') {
    y = hFrac * TREE_H;
    r = TREE_R * Math.pow(1 - hFrac, 1.3) * (0.3 + rSeed * 0.35);
  } else {
    y = 1.75 + hFrac * 1.9;
    const dy = (y - 2.75) / 1.55;
    r = 2.0 * Math.sqrt(Math.max(0, 1 - dy*dy)) * (0.45 + rSeed * 0.3);
  }
  return new THREE.Vector3(r * Math.cos(angle), y, r * Math.sin(angle));
}

// Scattered photos sit on a ring around the trunk sized to the viewport,
// so every one stays on screen (random sphere positions put half behind the camera)
function photoScatterPos(idx, total) {
  const R = Math.min(4.2, Math.max(2, Math.tan(Math.PI/6) * cam.aspect * 6));
  const angle = (idx / total) * Math.PI * 2 + 0.35;
  const r = R * (0.72 + 0.28 * ((idx * 5) % 3) / 2);
  const yWorld = -1.2 + (((idx * 7) % total) / Math.max(1, total - 1)) * 4.0;
  return new THREE.Vector3(r * Math.cos(angle), yWorld + TREE_DROP, r * Math.sin(angle));
}

function addPhotoSpriteFromTex(tex, aspect) {
  const idx = PHOTOS.length;
  const rSeed = Math.random();
  const tp = photoTreePos(idx, TOTAL_PHOTOS, rSeed, season);
  const mat = new THREE.SpriteMaterial({ map:tex, transparent:true, alphaTest:.02, depthWrite:false, blending:THREE.NormalBlending });
  const sprite = new THREE.Sprite(mat);
  sprite.position.copy(tp);
  sprite.scale.set(PHOTO_TREE_SCALE, PHOTO_TREE_SCALE/aspect, 1);
  grp.add(sprite);
  PHOTOS.push({
    sprite, treePos: tp, fromPos: tp.clone(), toPos: tp.clone(), rSeed,
    scatterPos: photoScatterPos(idx, TOTAL_PHOTOS), aspect,
    phase: Math.random()*Math.PI*2, speed: .22+Math.random()*.25,
    treeScale: PHOTO_TREE_SCALE, scatterScale: PHOTO_SCATTER_SCALE,
  });
}

// ─── Season switching (particles morph from one tree into the next) ──
let season = 'winter';
let morph = 1;
let morphMidDone = true;
const bgFrom = new THREE.Color(), bgTo = new THREE.Color();
const ambFrom = new THREE.Color(), ambTo = new THREE.Color();

function setSeason(name, instant = false) {
  if (!SEASONS[name] || (name === season && !instant)) return;
  season = name;
  const s = SEASONS[name];
  buildSeasonTree(name, treeTo, colTo);
  bgTo.setHex(s.bg); ambTo.setHex(s.ambient);
  PHOTOS.forEach((p, i) => {
    p.fromPos.copy(p.treePos);
    p.toPos.copy(photoTreePos(i, TOTAL_PHOTOS, p.rSeed, name));
  });

  if (instant) {
    treeCur.set(treeTo); pCols.set(colTo); pColA.needsUpdate = true;
    scene.background.copy(bgTo); ambientMat.color.copy(ambTo);
    PHOTOS.forEach(p => p.treePos.copy(p.toPos));
    applyOrnaments(name); applyFall(name);
    starAmt = s.star ? 1 : 0;
    morph = 1; morphMidDone = true;
  } else {
    treeFrom.set(treeCur); colFrom.set(pCols);
    bgFrom.copy(scene.background); ambFrom.copy(ambientMat.color);
    morph = 0; morphMidDone = false;
  }
  updateSeasonUI();
}

function easeInOutCubic(x) { return x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2; }

function stepMorph(dt) {
  if (morph >= 1) return;
  morph = Math.min(1, morph + dt/MORPH_SECONDS);
  const TAU = Math.PI*2;
  for (let i=0;i<N*3;i+=3) {
    // per-particle stagger so the tree regrows organically instead of all at once
    const local = Math.max(0, Math.min(1, morph*1.5 - (pSeeds[i]/TAU)*0.5));
    const e = easeInOutCubic(local);
    treeCur[i]   = treeFrom[i]   + (treeTo[i]  -treeFrom[i])  *e;
    treeCur[i+1] = treeFrom[i+1] + (treeTo[i+1]-treeFrom[i+1])*e;
    treeCur[i+2] = treeFrom[i+2] + (treeTo[i+2]-treeFrom[i+2])*e;
    pCols[i]   = colFrom[i]   + (colTo[i]  -colFrom[i])  *e;
    pCols[i+1] = colFrom[i+1] + (colTo[i+1]-colFrom[i+1])*e;
    pCols[i+2] = colFrom[i+2] + (colTo[i+2]-colFrom[i+2])*e;
  }
  pColA.needsUpdate = true;
  const e = easeInOutCubic(morph);
  scene.background.copy(bgFrom).lerp(bgTo, e);
  ambientMat.color.copy(ambFrom).lerp(ambTo, e);
  PHOTOS.forEach(p => p.treePos.lerpVectors(p.fromPos, p.toPos, e));
  if (!morphMidDone && morph >= 0.5) {
    applyOrnaments(season); applyFall(season);
    morphMidDone = true;
  }
}

// ─── State machine ───────────────────────────────────────────────
let state      = 'tree'; // 'tree' | 'scattered' | 'focused'
let scatAmt    = 0;
let scatTarget = 0;
let currentEa  = 0;
let waveVel    = 0;
let rotY       = 0;

function easeOut(t)     { return 1-Math.pow(1-t,3); }
function easeOutCubic(t){ return 1-Math.pow(1-t,3); }
function easeOutBack(t) { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); }

function setState(s) {
  state = s;
  scatTarget = (s==='tree') ? 0 : 1;
  gestureHist = []; // clear stale history so old gesture doesn't immediately re-fire
  if (s==='focused') currentGesture = 'none';
}

// ─── Focus (pinch) trajectory animation ──────────────────────────
let focusAnim = null;

function quadBezier(p0,p1,p2,tt) {
  const mt = 1-tt;
  return new THREE.Vector3(
    mt*mt*p0.x + 2*mt*tt*p1.x + tt*tt*p2.x,
    mt*mt*p0.y + 2*mt*tt*p1.y + tt*tt*p2.y,
    mt*mt*p0.z + 2*mt*tt*p1.z + tt*tt*p2.z,
  );
}

function startFocusIn(idx) {
  const item = PHOTOS[idx];
  if (!item) return;
  grp.updateMatrixWorld(true);
  const startLocal  = item.sprite.position.clone();
  const startScaleX = item.sprite.scale.x;
  const targetWorld = new THREE.Vector3(0, 1.3, 5.6);
  const endLocal = grp.worldToLocal(targetWorld.clone());
  const controlLocal = startLocal.clone().lerp(endLocal, 0.5).add(
    new THREE.Vector3((Math.random()-.5)*2.4, 1.0+Math.random()*.8, (Math.random()-.5)*1.2)
  );
  item.sprite.renderOrder = 999;
  focusAnim = {
    idx, phase:'in', t:0, duration:1.0,
    startLocal, endLocal, controlLocal,
    startScaleX, endScaleX: PHOTO_FOCUS_SCALE,
    aspect: item.aspect,
    origStartLocal: startLocal.clone(),
    origStartScaleX: startScaleX,
  };
}

function startFocusOut() {
  if (!focusAnim) return;
  const saved = focusAnim;
  const item = PHOTOS[saved.idx];
  if (!item) return;
  // Start from the photo's CURRENT position/scale so there's no jump mid-animation
  focusAnim = {
    idx: saved.idx, phase:'out', t:0, duration:0.85,
    startLocal: item.sprite.position.clone(),
    endLocal: saved.origStartLocal.clone(),
    controlLocal: saved.controlLocal.clone(),
    startScaleX: item.sprite.scale.x,
    endScaleX: saved.origStartScaleX,
    aspect: saved.aspect,
    origStartLocal: saved.origStartLocal.clone(),
    origStartScaleX: saved.origStartScaleX,
  };
}

function cancelFocus() {
  if (focusAnim) {
    const item = PHOTOS[focusAnim.idx];
    if (item) item.sprite.renderOrder = 0;
  }
  focusAnim = null;
}

// ─── Gesture detection ────────────────────────────────────────────
let gestureHist = [];
let currentGesture = 'fist';
let handHist = [];
let pinchReleased = true;

const gestureValueEl = document.getElementById('gesture-value');
function updateGestureLabel(g) {
  const map = { fist:'FIST', open:'OPEN PALM', pinch:'PINCH', wave:'WAVE', none:'—' };
  gestureValueEl.textContent = map[g] || g.toUpperCase();
}

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function fingerExtended(lm,tip,mcp) {
  const wrist = lm[0];
  return dist(lm[tip],wrist) > dist(lm[mcp],wrist) * 1.55;
}

function rawGesture(lm) {
  const ext = [
    fingerExtended(lm,8,5), fingerExtended(lm,12,9),
    fingerExtended(lm,16,13), fingerExtended(lm,20,17),
  ].filter(Boolean).length;
  const d = dist(lm[4], lm[8]);
  if (ext >= 3) return 'open';
  // Pinch: thumb tip sits at the index TIP, far from the index knuckle.
  // Fist: thumb wraps near the knuckle, so both distances are similar.
  const dKnuckle = dist(lm[4], lm[5]);
  if (d < 0.08 && d < dKnuckle * 0.72) return 'pinch';
  if (ext === 0) return 'fist';
  return 'none';
}

function checkWave(lm) {
  const cx = lm[9].x;
  const now = performance.now();
  handHist.push({x:cx,t:now});
  if (handHist.length>HAND_HIST) handHist.shift();
  if (handHist.length<8) return null;
  const a=handHist[0], b=handHist[handHist.length-1];
  const vel=(b.x-a.x)/((b.t-a.t)/1000);
  if (Math.abs(vel)>WAVE_THR) return vel>0?'wave_r':'wave_l';
  return null;
}

function onGesture(g) {
  if (g===currentGesture) return;
  currentGesture = g;
  updateGestureLabel(g);

  if (g==='fist') {
    if (state==='focused') startFocusOut(); else cancelFocus();
    setState('tree');
    pinchReleased = true;
  } else if (g==='open' && state==='tree') {
    setState('scattered');
  } else if (g==='open' && state==='focused') {
    startFocusOut();
    setState('scattered');
    pinchReleased = true;
  } else if (g==='pinch' && pinchReleased && PHOTOS.length>0 && state!=='focused') {
    pinchReleased = false;
    if (state==='tree') { setState('scattered'); scatAmt = 1; currentEa = 1; }
    const idx = Math.floor(Math.random()*PHOTOS.length);
    startFocusIn(idx);
    setState('focused');
  }
}

// ─── MediaPipe ────────────────────────────────────────────────────
const vidEl    = document.getElementById('camera-feed');
const mirrorEl = document.getElementById('cam-mirror');

async function startCam() {
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480, facingMode:'user' } });
    vidEl.srcObject = mirrorEl.srcObject = s;
    await vidEl.play(); await mirrorEl.play();
    return true;
  } catch { return false; }
}

function setupMP() {
  if (typeof Hands === 'undefined') return;
  const hands = new Hands({ locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${f}` });
  hands.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:.7, minTrackingConfidence:.55 });
  hands.onResults(res => {
    if (!res.multiHandLandmarks?.length) { handHist=[]; gestureHist=[]; return; }
    const lm = res.multiHandLandmarks[0];

    if (state!=='tree') {
      const w = checkWave(lm);
      if (w) { gestureHist=[]; waveVel += (w==='wave_r'?1:-1)*.3; updateGestureLabel('wave'); return; }
    }

    const g = rawGesture(lm);
    gestureHist.push(g);
    if (gestureHist.length>DEBOUNCE) gestureHist.shift();
    if (gestureHist.length===DEBOUNCE && gestureHist.every(x=>x===gestureHist[0]))
      onGesture(gestureHist[0]);
    if (g!=='pinch') pinchReleased = true;
  });
  const c = new Camera(vidEl, { onFrame: async()=>hands.send({image:vidEl}), width:640, height:480 });
  c.start();
}

// ─── Keyboard fallback ─────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;
  if (e.key==='f'||e.key==='F') onGesture('fist');
  else if (e.key==='o'||e.key==='O') onGesture('open');
  else if (e.key==='p'||e.key==='P') onGesture('pinch');
  else if (e.key==='ArrowLeft')  waveVel -= .12;
  else if (e.key==='ArrowRight') waveVel += .12;
  else if (e.key>='1' && e.key<='4') setSeason(SEASON_ORDER[+e.key-1]);
});

// ─── Animation loop ─────────────────────────────────────────────────
const clock = new THREE.Clock();
let t = 0;
let viewShift = 0, viewShiftTarget = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05);
  t += dt;

  stepMorph(dt);

  // Upload screen: slide the tree right so it isn't hidden behind the card
  viewShift += (viewShiftTarget - viewShift) * 0.05;
  if (Math.abs(viewShift) > 0.0005) cam.setViewOffset(innerWidth, innerHeight, -viewShift*innerWidth, 0, innerWidth, innerHeight);
  else if (cam.view && cam.view.enabled) cam.clearViewOffset();

  scatAmt += (scatTarget - scatAmt) * (scatTarget < scatAmt ? .07 : .025);
  const ea = easeOut(Math.max(0, Math.min(1, scatAmt)));
  currentEa = ea;

  if (state === 'tree') rotY += dt * 0.38;
  waveVel *= WAVE_DAMP;
  rotY += waveVel * dt;
  grp.rotation.y = rotY;

  // Star (winter only) — shrinks away for other seasons
  starAmt += ((SEASONS[season].star ? 1 : 0) - starAmt) * 0.06;
  starGrp.visible = starAmt > 0.01;
  starGrp.scale.setScalar(Math.max(0.001, starAmt));
  starGrp.position.lerpVectors(STAR_TREE_POS, STAR_SCAT_POS, ea);
  const ss = 1+Math.sin(t*2.2)*.15;
  starGlow.scale.set(ss*0.7, ss*0.7, 1);
  starGlow.material.opacity = 0.22;
  starMesh.rotation.z = t*.3;

  // Glowing dust particles
  pMat.size = PARTICLE_SIZE_TREE + (PARTICLE_SIZE_SCATTER-PARTICLE_SIZE_TREE)*ea;
  const noise = ea*.055 + .012;
  for (let i=0;i<N*3;i+=3) {
    curPts[i]   = treeCur[i]   + (scatPts[i]  -treeCur[i])  *ea + Math.sin(t*.7+pSeeds[i])  *noise;
    curPts[i+1] = treeCur[i+1] + (scatPts[i+1]-treeCur[i+1])*ea + Math.sin(t*.5+pSeeds[i+1])*noise;
    curPts[i+2] = treeCur[i+2] + (scatPts[i+2]-treeCur[i+2])*ea + Math.cos(t*.6+pSeeds[i+2])*noise;
  }
  pPosA.needsUpdate = true;

  // Ambient dust
  const arr = aposA.array;
  for (let i=0;i<AM;i++) {
    arr[i*3]   = abase[i*3]   + Math.sin(t*.25+ased[i*3+1])*.2;
    arr[i*3+1] = abase[i*3+1] + Math.sin(t*.4 +ased[i*3])  *.28;
  }
  aposA.needsUpdate = true;

  // Photos (skip the one being focus-animated)
  PHOTOS.forEach((item, i) => {
    if (focusAnim && focusAnim.idx===i) return;
    const tp = item.treePos, sp2 = item.scatterPos;
    const fy = Math.sin(t*item.speed+item.phase)*.1;
    const px = tp.x+(sp2.x-tp.x)*ea + Math.sin(t*.6+item.phase)*noise;
    const py = tp.y+(sp2.y-tp.y)*ea + fy*ea + Math.cos(t*.5+item.phase)*noise;
    const pz = tp.z+(sp2.z-tp.z)*ea + Math.sin(t*.55+item.phase*1.3)*noise;
    item.sprite.position.set(px, py, pz);
    const s = item.treeScale + (item.scatterScale-item.treeScale)*ea;
    item.sprite.scale.set(s, s/item.aspect, 1);
  });

  // Decorations shrink out and regrow while the season changes
  const swapFade = morph < 1 ? Math.abs(1 - 2*morph) : 1;

  ORNAMENTS.forEach(o => {
    if (!o.sprite.visible) return;
    o.sprite.position.set(
      o.basePos.x + (o.scatPos.x - o.basePos.x) * ea,
      o.basePos.y + (o.scatPos.y - o.basePos.y) * ea + Math.sin(t * o.speed + o.phase) * 0.055,
      o.basePos.z + (o.scatPos.z - o.basePos.z) * ea
    );
    const s = o.sz * (1 + ea * 0.6) * swapFade + 0.0001;
    o.sprite.scale.set(s, s, 1);
    if (o.swing) o.sprite.material.rotation = o.baseRot + Math.sin(t * o.speed * 3 + o.phase) * o.swing;
  });

  fallMat.opacity = swapFade;
  for (let i=0;i<fallCfg.count;i++) {
    const f = FALL_POOL[i], p = f.pos;
    if (fallCfg.wander) {
      p.set(
        f.base.x + Math.sin(t*.3 + f.phase)*.7,
        f.base.y + Math.sin(t*.23 + f.phase*1.7)*.45,
        f.base.z + Math.cos(t*.27 + f.phase)*.55
      );
      const blink = 0.12 + 0.88*Math.pow(Math.max(0, Math.sin(t*1.3 + f.phase*3)), 2);
      fallMesh.setColorAt(i, tmpCol.copy(f.col).multiplyScalar(f.op * blink));
    } else {
      p.x += (f.vx + Math.sin(t*0.6 + f.phase) * fallCfg.sway) * dt;
      p.y += f.vy * dt;
      f.rz += f.spin * dt;
      if (p.y < -8) { p.y = 9; p.x = (Math.random() - 0.5) * 22; }
      if (p.x > 12) p.x = -12;
    }
    fallDummy.position.copy(p);
    if (fallCfg.tumble) fallDummy.rotation.set(t*f.rx + f.phase, t*f.ry, f.rz);
    else                fallDummy.rotation.set(0, 0, f.rz);
    fallDummy.scale.setScalar(f.sz);
    fallDummy.updateMatrix();
    fallMesh.setMatrixAt(i, fallDummy.matrix);
  }
  fallMesh.instanceMatrix.needsUpdate = true;
  if (fallCfg.wander) fallMesh.instanceColor.needsUpdate = true;

  // Focus trajectory animation
  if (focusAnim) {
    focusAnim.t += dt;
    const tt = Math.min(1, focusAnim.t/focusAnim.duration);
    const posT   = easeOutCubic(tt);
    const scaleT = focusAnim.phase==='in' ? easeOutBack(tt) : easeOutCubic(tt);
    const pos = quadBezier(focusAnim.startLocal, focusAnim.controlLocal, focusAnim.endLocal, posT);
    const item = PHOTOS[focusAnim.idx];
    if (item) {
      item.sprite.position.copy(pos);
      const sx = focusAnim.startScaleX + (focusAnim.endScaleX-focusAnim.startScaleX)*scaleT;
      item.sprite.scale.set(sx, sx/focusAnim.aspect, 1);
    }
    if (tt>=1) {
      if (focusAnim.phase==='out') {
        if (item) item.sprite.renderOrder = 0;
        focusAnim = null;
      } else {
        focusAnim.phase = 'idle';
      }
    }
  }

  composer.render();
}

  cam.aspect = innerWidth/innerHeight;

// ─── Share / URL encoding ────────────────────────────────────────
// Photos are compressed to small JPEGs and stored in the URL hash so the
// link is entirely self-contained — no server or storage service needed.
const HASH_PREFIX = '#p=';
let shareDataUrls = [];

async function compressToDataUrl(img, maxPx = 280, quality = 0.62) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  const ratio = Math.min(maxPx / iw, maxPx / ih, 1);
  const w = Math.round(iw * ratio);
  const h = Math.round(ih * ratio);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', quality);
}

function buildShareURL() {
  const parts = shareDataUrls.map(d => d.replace(/^data:image\/jpeg;base64,/, ''));
  const hash  = HASH_PREFIX + encodeURIComponent(JSON.stringify(parts));
  return location.origin + location.pathname + '?season=' + season + hash;
}

function parseSharedPhotos() {
  if (!location.hash.startsWith(HASH_PREFIX)) return null;
  try {
    const raw   = decodeURIComponent(location.hash.slice(HASH_PREFIX.length));
    const parts = JSON.parse(raw);
    if (!Array.isArray(parts) || !parts.length) return null;
    return parts.map(p => 'data:image/jpeg;base64,' + p);
  } catch { return null; }
}

async function loadDataUrls(dataUrls) {
  TOTAL_PHOTOS = dataUrls.length;
  shareDataUrls = dataUrls;
  for (const dataUrl of dataUrls) {
    await new Promise(resolve => {
      const img = new Image();
      img.onload  = () => { addPhotoSpriteFromTex(makeRoundedPhotoTex(img), 1); resolve(); };
      img.onerror = resolve;
      img.src = dataUrl;
    });
  }
}

const shareBtn   = document.getElementById('share-btn');

function renderSharePanel() {
  const n = shareDataUrls.length;
  const stack = document.getElementById('sp-stack');
  stack.innerHTML = '';
  const SHOW = 5;
  shareDataUrls.slice(0, SHOW).forEach(src => {
    const img = document.createElement('img');
    img.src = src; img.alt = '';
    stack.appendChild(img);
  });
  if (n > SHOW) {
    const more = document.createElement('div');
    more.className = 'more';
    more.textContent = `+${n - SHOW}`;
    stack.appendChild(more);
  }
  document.getElementById('sp-url').textContent =
    `${location.host}${location.pathname}?season=${season}#…`;
}

function openSharePanel() {
  renderSharePanel();
  sharePanel.hidden = false;
  shareBtn.classList.add('active');
  shareBtn.setAttribute('aria-expanded', 'true');
}
function closeSharePanel() {
  sharePanel.hidden = true;
  shareBtn.classList.remove('active');
  shareBtn.setAttribute('aria-expanded', 'false');
}

  e.stopPropagation();
  sharePanel.hidden ? openSharePanel() : closeSharePanel();
});

  if (!sharePanel.hidden && !sharePanel.contains(e.target)) closeSharePanel();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSharePanel(); });

spCopy.addEventListener('click', async () => {
  const url = buildShareURL();
  try {
    await navigator.clipboard.writeText(url);
  } catch {
    const inp = document.createElement('input');
    inp.value = url; document.body.appendChild(inp);
    inp.select(); document.execCommand('copy'); inp.remove();
  }
  spCopy.classList.add('done');
  spCopyLbl.textContent = 'Link copied';
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => {
    spCopy.classList.remove('done');
    spCopyLbl.textContent = 'Copy link';
  }, 2200);
});

// ─── Upload screen ───────────────────────────────────────────────
function uploadViewShift() {
  if (innerWidth <= 760) return 0;
  const card = document.querySelector('.upload-card');
  const right = card ? card.getBoundingClientRect().right : 0;
  return Math.min(0.24, right / 2 / innerWidth);
}

function showUploadScreen() {
  const MAX       = 15;
  const screen    = document.getElementById('upload-screen');
  const fileInput = document.getElementById('file-input');
  const grid      = document.getElementById('photo-grid');
  const counter   = document.getElementById('photo-count');
  const startBtn  = document.getElementById('start-btn');
  let items = []; // { src: downscaled canvas, thumb: small data URL, pending, fresh }
  let warnTimer = 0;

  const PLUS = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const CROSS = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 2l6 6M8 2l-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

  const isPending = () => items.some(it => it.pending);

  function showCount() {
    counter.classList.remove('warn');
    counter.textContent = isPending() ? 'Adding photos…'
      : items.length ? `${items.length} / ${MAX} photos` : `0 / ${MAX}`;
  }
  function showWarn(msg, ms = 3200) {
    counter.classList.add('warn');
    counter.textContent = msg;
    clearTimeout(warnTimer);
    warnTimer = setTimeout(() => { warnTimer = 0; showCount(); }, ms);
  }
  const showLimit = () => showWarn(`The tree holds ${MAX} photos — remove one to add more`);

  function openPicker() {
    if (items.length >= MAX) { showLimit(); return; }
    fileInput.click();
  }

  // Decode any picked file as robustly as possible. Returns a downscaled canvas or throws.
  const isHeic = f => /image\/hei[cf]/i.test(f.type) || /\.hei[cf]$/i.test(f.name);
  let heicLib = null;
  function loadHeicLib() {
    heicLib ??= new Promise((res, rej) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
      sc.onload = () => res(window.heic2any);
      sc.onerror = () => { heicLib = null; rej(new Error('heic2any failed to load')); };
      document.head.appendChild(sc);
    });
    return heicLib;
  }
  function imgFromBlob(blob) {
    return new Promise(resolve => {
      const u = URL.createObjectURL(blob);
      const img = new Image();
      img.onload  = () => { URL.revokeObjectURL(u); resolve(img); };
      img.onerror = () => { URL.revokeObjectURL(u); resolve(null); };
      img.src = u;
    });
  }
  async function decodeFile(file) {
    try { return await createImageBitmap(file); } catch {}
    const viaUrl = await imgFromBlob(file);
    if (viaUrl) return viaUrl;
    const buf = await file.arrayBuffer();            // throws if the file can't be read at all
    const head = new TextDecoder('latin1').decode(new Uint8Array(buf.slice(0, 16)));
    if (/ftyp(hei|hev|mif|msf)/.test(head) || isHeic(file)) {
      const heic2any = await loadHeicLib();
      let jpg = await heic2any({ blob: new Blob([buf]), toType: 'image/jpeg', quality: 0.9 });
      if (Array.isArray(jpg)) jpg = jpg[0];
      const img = await imgFromBlob(jpg);
      if (img) return img;
    }
    const retry = await imgFromBlob(new Blob([buf], { type: 'image/jpeg' }));
    if (retry) return retry;
    throw new Error(`undecodable (type="${file.type}", header=${JSON.stringify(head)})`);
  }
  function toCanvas(src, maxPx = 720) {
    const w = src.naturalWidth || src.width, h = src.naturalHeight || src.height;
    const r = Math.min(1, maxPx / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * r); c.height = Math.round(h * r);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    if (src.close) src.close();
    return c;
  }
  function makeThumb(canvas) {
    const S = 160, c = document.createElement('canvas');
    c.width = c.height = S;
    const side = Math.min(canvas.width, canvas.height);
    c.getContext('2d').drawImage(canvas, (canvas.width-side)/2, (canvas.height-side)/2, side, side, 0, 0, S, S);
    return c.toDataURL('image/jpeg', 0.8);
  }
  async function prepare(file) {
    const canvas = toCanvas(await decodeFile(file));
    return { src: canvas, thumb: makeThumb(canvas) };
  }

  async function addFiles(newFiles) {
    const all = [...newFiles];
    console.info(`[upload] received ${all.length} file(s):`, all.map(f => `${f.name} | ${f.type || 'no type'} | ${f.size}B`));
    // only skip things that are clearly not pictures (videos, docs); unknown types still get a decode attempt
    const files0 = all.filter(f => !f.type || f.type.startsWith('image/') || isHeic(f));
    if (!files0.length) { showWarn('Those files aren\'t photos'); return; }
    const slots = MAX - items.length;
    if (slots <= 0) { showLimit(); return; }
    const files = files0.slice(0, slots);
    const batch = files.map(() => ({ pending: true }));
    items.push(...batch);
    render();

    const failed = [];
    let next = 0;
    async function worker() {
      while (next < files.length) {
        const k = next++;
        let res = null;
        try { res = await prepare(files[k]); }
        catch (err) { console.warn(`[upload] could not read ${files[k].name}:`, err); }
        const it = batch[k];
        const idx = items.indexOf(it);
        if (idx === -1) continue;
        if (res) Object.assign(it, res, { pending: false, fresh: true });
        else { failed.push(files[k].name); items.splice(idx, 1); }
        render();
      }
    }
    await Promise.all([worker(), worker(), worker(), worker()]);

    if (failed.length) showWarn(`Couldn't read ${failed.length}: ${failed.join(', ')}`, 6000);
    else if (files0.length > slots) showLimit();
  }

  function removeAt(idx) {
    items.splice(idx, 1);
    render();
  }

  function render() {
    grid.innerHTML = '';
    for (let i=0;i<MAX;i++) {
      const slot = document.createElement('div');
      const it = items[i];
      if (it && it.pending) {
        slot.className = 'slot loading';
      } else if (it) {
        slot.className = 'slot filled';
        const img = document.createElement('img');
        img.src = it.thumb;
        img.alt = '';
        if (it.fresh) { img.className = 'new'; it.fresh = false; }
        const del = document.createElement('button');
        del.className = 'del';
        del.title = 'Remove';
        del.innerHTML = CROSS;
        del.addEventListener('click', () => removeAt(i));
        slot.append(img, del);
      } else {
        slot.className = i === items.length ? 'slot add' : 'slot';
        if (i === items.length) slot.innerHTML = PLUS;
        slot.addEventListener('click', openPicker);
      }
      grid.appendChild(slot);
    }
    if (!warnTimer) showCount();
    startBtn.disabled = items.length === 0 || isPending();
  }

  fileInput.addEventListener('change', e => {
    addFiles(e.target.files);
    fileInput.value = '';
  });

  let dragDepth = 0;
  window.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; screen.classList.add('drag'); });
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; screen.classList.remove('drag'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => {
    e.preventDefault();
    dragDepth = 0; screen.classList.remove('drag');
    if (screen.isConnected) addFiles(e.dataTransfer.files);
  });

  startBtn.addEventListener('click', async () => {
    if (!items.length || isPending()) return;
    startBtn.disabled = true;
    startBtn.textContent = 'Growing…';

    TOTAL_PHOTOS = items.length;
    shareDataUrls = [];
    for (const { src } of items) {
      addPhotoSpriteFromTex(makeRoundedPhotoTex(src), 1);
      shareDataUrls.push(await compressToDataUrl(src));
    }

    viewShiftTarget = 0;
    screen.classList.add('out');
    setTimeout(() => screen.remove(), 650);
    init();
  });

  render();
  viewShiftTarget = uploadViewShift();
}

// ─── Startup ─────────────────────────────────────────────────────
const urlSeason = new URLSearchParams(location.search).get('season');
setSeason(SEASONS[urlSeason] ? urlSeason : seasonFromDate(), true);
animate();

const sharedPhotos = parseSharedPhotos();
if (sharedPhotos) {
  document.getElementById('upload-screen').remove();
  loadDataUrls(sharedPhotos).then(() => init());
} else {
  showUploadScreen();
}
</script>
</body>
</html>
